<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArcGIS 計算器測試</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f9f9f9; }
        .box { max-width: 280px; padding: 15px; border: 1px solid #ccc; background: #fff; border-radius: 8px; }
        input { width: 60px; padding: 5px; margin: 5px; }
        button { padding: 6px 12px; background: #0079c1; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        #result { margin-top: 15px; font-weight: bold; color: #0079c1; }
    </style>
</head>
<body>
    <div class="box">
        <h3>簡單加法器</h3>
        <input type="number" id="n1" placeholder="數字1"> +
        <input type="number" id="n2" placeholder="數字2">
        <button onclick="calc()">計算</button>
        <div id="result">結果：</div>
    </div>
    <script>
        function calc() {
            var v1 = parseFloat(document.getElementById('n1').value) || 0;
            var v2 = parseFloat(document.getElementById('n2').value) || 0;
            document.getElementById('result').innerText = "結果：" + (v1 + v2);
        }
    </script>
</body>
</html>
